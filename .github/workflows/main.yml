name: Actualizar noticias de drones
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/actualizar_noticias.py
      - name: Guardar cambios
        run: |
          git config user.name "noticias-bot"
          git config user.email "noticias-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Noticias $(date -u +%F)"
          git push
